<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>KOF Wing</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KOF Wing">
<meta name="theme-color" content="#000000">
<style>
:root{--b:min(17vh,13vw);}
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:sans-serif}
#game{position:fixed;inset:0}
#game ruffle-player{width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
#ui.hidden .pad,#ui.hidden #panel{display:none}
.btn{position:absolute;width:var(--b);height:var(--b);border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.55);color:#fff;font:700 calc(var(--b)*.34)/1 sans-serif;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;box-sizing:border-box;text-shadow:0 0 4px #000}
.btn.on{background:rgba(255,200,0,.55);border-color:#ffd24a}
#dpad{position:absolute;left:max(2vw,env(safe-area-inset-left));bottom:5vh;width:calc(var(--b)*2.3);height:calc(var(--b)*2.3);border-radius:50%;background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.4);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:calc(var(--b)*.9);height:calc(var(--b)*.9);margin:calc(var(--b)*-.45) 0 0 calc(var(--b)*-.45);border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.7);pointer-events:none}
.arrow{position:absolute;color:rgba(255,255,255,.7);font:700 calc(var(--b)*.3)/1 sans-serif;pointer-events:none}
#menu{position:absolute;top:max(1.5vh,env(safe-area-inset-top));right:max(2vw,env(safe-area-inset-right));width:calc(var(--b)*.62);height:calc(var(--b)*.62);font-size:calc(var(--b)*.34)}
#panel{position:absolute;top:calc(max(1.5vh,env(safe-area-inset-top)) + var(--b)*.7);right:max(2vw,env(safe-area-inset-right));display:none;gap:6px;flex-direction:column;pointer-events:auto}
#panel.open{display:flex}
#panel .btn{position:static;border-radius:12px;width:calc(var(--b)*1.5);height:calc(var(--b)*.55);font-size:calc(var(--b)*.26)}
</style></head>
<body>
<div id="game"></div>
<div id="ui">
  <div class="pad" id="dpad"><div id="knob"></div>
    <span class="arrow" style="left:50%;top:6%;transform:translateX(-50%)">▲</span>
    <span class="arrow" style="left:50%;bottom:6%;transform:translateX(-50%)">▼</span>
    <span class="arrow" style="left:7%;top:50%;transform:translateY(-50%)">◀</span>
    <span class="arrow" style="right:7%;top:50%;transform:translateY(-50%)">▶</span>
  </div>
  <div id="keys"></div>
  <div class="btn" id="menu">☰</div>
  <div id="panel"></div>
</div>
<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {
  autoplay:"on", unmuteOverlay:"visible", letterbox:"on", splashScreen:false,
  contextMenu:"off", quality:"medium", forceScale:true, scale:"showAll",
  openUrlMode:"deny", warnOnUnsupportedContent:false, showSwfDownload:false,
  preloader:true, base:"./"
};
</script>
<script src="ruffle/ruffle.js"></script>
<script>
(function(){
  var player;
  var KEYS={W:["KeyW","w",87],A:["KeyA","a",65],S:["KeyS","s",83],D:["KeyD","d",68],
    J:["KeyJ","j",74],K:["KeyK","k",75],L:["KeyL","l",76],U:["KeyU","u",85],I:["KeyI","i",73],O:["KeyO","o",79],
    Enter:["Enter","Enter",13],Esc:["Escape","Escape",27],Space:["Space"," ",32],P:["KeyP","p",80],
    N1:["Numpad1","1",97],N2:["Numpad2","2",98],N3:["Numpad3","3",99]};
  var down={};
  function fire(id,type){
    var k=KEYS[id]; if(!k||!player) return;
    if(document.activeElement!==player){try{player.focus({preventScroll:true});}catch(x){}}
    var ev=new KeyboardEvent(type,{code:k[0],key:k[1],keyCode:k[2],which:k[2],bubbles:true,cancelable:true,composed:true});
    player.dispatchEvent(ev);
  }
  function setKey(id,on){
    if(!!down[id]===on) return;
    down[id]=on; fire(id,on?"keydown":"keyup");
  }
  function boot(){
    var r=window.RufflePlayer.newest();
    player=r.createPlayer();
    document.getElementById("game").appendChild(player);
    player.load({url:"loader1.9.swf"});
  }
  if(document.readyState==="complete") boot(); else window.addEventListener("load",boot);

  // botoes de golpe (layout igual ao teclado: U I O em cima, J K L embaixo)
  var keysEl=document.getElementById("keys");
  var layout=[["U",0,1],["I",1,1],["O",2,1],["J",0,0],["K",1,0],["L",2,0]];
  layout.forEach(function(b){
    var d=document.createElement("div"); d.className="btn"; d.textContent=b[0];
    var col=b[1], top=b[2];
    d.style.right="calc(max(2vw,env(safe-area-inset-right)) + var(--b)*"+((2-col)*1.12)+")";
    d.style.bottom="calc(5vh + var(--b)*"+(top?1.2:0.15)+")";
    bindBtn(d,b[0]);
    keysEl.appendChild(d);
  });
  function bindBtn(el,id){
    function on(e){e.preventDefault();el.setPointerCapture&&el.setPointerCapture(e.pointerId);el.classList.add("on");setKey(id,true);}
    function off(e){e.preventDefault();el.classList.remove("on");setKey(id,false);}
    el.addEventListener("pointerdown",on);
    el.addEventListener("pointerup",off);
    el.addEventListener("pointercancel",off);
    el.addEventListener("lostpointercapture",off);
    el.addEventListener("contextmenu",function(e){e.preventDefault();});
  }

  // D-pad analogico -> W A S D (8 direcoes)
  var dpad=document.getElementById("dpad"), knob=document.getElementById("knob"), pid=null;
  function upd(e){
    var r=dpad.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2, R=r.width/2;
    var dx=(e.clientX-cx)/R, dy=(e.clientY-cy)/R, m=Math.hypot(dx,dy)||1;
    var kx=Math.max(-1,Math.min(1,dx/Math.max(m,1))), ky=Math.max(-1,Math.min(1,dy/Math.max(m,1)));
    knob.style.transform="translate("+(kx*R*.5)+"px,"+(ky*R*.5)+"px)";
    var t=.28;
    setKey("A",dx<-t); setKey("D",dx>t); setKey("W",dy<-t); setKey("S",dy>t);
  }
  function rel(){pid=null;knob.style.transform="";["A","D","W","S"].forEach(function(k){setKey(k,false);});}
  dpad.addEventListener("pointerdown",function(e){e.preventDefault();pid=e.pointerId;dpad.setPointerCapture(pid);upd(e);});
  dpad.addEventListener("pointermove",function(e){if(e.pointerId===pid){e.preventDefault();upd(e);}});
  dpad.addEventListener("pointerup",function(e){if(e.pointerId===pid)rel();});
  dpad.addEventListener("pointercancel",function(e){if(e.pointerId===pid)rel();});
  dpad.addEventListener("lostpointercapture",function(e){if(e.pointerId===pid)rel();});

  // menu extra
  var panel=document.getElementById("panel");
  [["Enter","Enter"],["Esc","Esc"],["Space","Espaço"],["P","P (pausa)"],["__hide","Ocultar controles"]].forEach(function(p){
    var d=document.createElement("div"); d.className="btn"; d.textContent=p[1];
    if(p[0]==="__hide"){
      d.addEventListener("pointerdown",function(e){e.preventDefault();document.getElementById("ui").classList.add("hidden");panel.classList.remove("open");});
    } else bindBtn(d,p[0]);
    panel.appendChild(d);
  });
  var menu=document.getElementById("menu");
  menu.addEventListener("pointerdown",function(e){
    e.preventDefault();
    var ui=document.getElementById("ui");
    if(ui.classList.contains("hidden")){ui.classList.remove("hidden");return;}
    panel.classList.toggle("open");
  });
  window.addEventListener("contextmenu",function(e){e.preventDefault();});
})();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
document.addEventListener("gesturestart",function(e){e.preventDefault();});
document.addEventListener("touchmove",function(e){e.preventDefault();},{passive:false});
</script>
</body></html>
